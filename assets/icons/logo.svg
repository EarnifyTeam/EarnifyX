<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Modern Flask Body -->
  <path d="M44 20 L56 20 L56 36 L76 72 C79 78 74 84 68 84 L32 84 C26 84 21 78 24 72 L44 36 Z" 
        fill="none" 
        stroke="url(#flaskGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Liquid Level -->
  <path d="M30 68 C38 64 42 72 50 67 C58 62 62 70 70 68 L73 73 C75 77 71 81 67 81 L33 81 C29 81 25 77 27 73 Z" 
        fill="url(#flaskGrad)" 
        opacity="0.85" />
  
  <!-- Flask Lip -->
  <rect x="40" y="14" width="20" height="6" rx="3" fill="#3b82f6" />
  
  <!-- Bubbles -->
  <circle cx="48" cy="56" r="3.5" fill="#93c5fd" opacity="0.9" filter="url(#glow)"/>
  <circle cx="58" cy="48" r="2.5" fill="#bfdbfe" opacity="0.8" />
  <circle cx="42" cy="74" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="56" cy="72" r="3" fill="#ffffff" opacity="0.9" />
</svg>
