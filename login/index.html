<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EarnifyX Lab</title>
    <meta name="description" content="Login to your EarnifyX Lab creator account to access saved prompts and downloads.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between;">

    <!-- Minimal Header -->
    <header class="site-header">
        <div class="header-left">
            <a href="./" class="brand-logo">
                <div class="flask-icon">
                    <img src="assets/icons/logo.svg" alt="EarnifyX Lab Logo" width="28" height="28">
                </div>
                <div class="brand-text">
                    <span class="brand-title">Earnify<span>X</span>Lab</span>
                    <span class="brand-tagline">Tools • Prompts • Resources</span>
                </div>
            </a>
        </div>
        <div class="header-right">
            <button class="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
                <span class="theme-toggle-icon">🌙</span>
            </button>
        </div>
    </header>

    <!-- Center Login Form Card -->
    <main style="display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; flex: 1;">
        <div style="background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.5rem; max-width: 440px; width: 100%; box-shadow: var(--shadow-md);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.35rem;">Welcome Back</h1>
                <p class="text-secondary" style="font-size: 0.9rem;">Login to your EarnifyX Lab account.</p>
            </div>

            <!-- Social OAuth Button -->
            <button class="btn btn-secondary" style="width: 100%; height: 44px; margin-bottom: 1.25rem; font-size: 0.9rem;" onclick="handleOAuthLogin('Google')">
                <span style="font-weight: 700; color: #ea4335;">G</span> Continue with Google
            </button>

            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; color: var(--text-muted); font-size: 0.78rem;">
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                <span>OR EMAIL</span>
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
            </div>

            <form id="loginForm" onsubmit="handleFormLogin(event)">
                <!-- FUTURE SUPABASE AUTHENTICATION
                     const { data, error } = await supabase.auth.signInWithPassword({
                         email: emailInput.value,
                         password: passwordInput.value,
                     });
                -->
                <div style="margin-bottom: 1.1rem;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.4rem;" for="email">
                        Email
                    </label>
                    <input type="email" id="email" required placeholder="name@example.com" 
                           style="width: 100%; height: 42px; padding: 0 0.85rem; background: var(--bg-surface-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.9rem; outline: none;">
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <div class="flex items-center justify-between" style="margin-bottom: 0.4rem;">
                        <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary);" for="password">Password</label>
                        <a href="#" onclick="showToast('Password reset will be handled by Supabase Auth.')" style="font-size: 0.78rem; color: var(--accent-primary);">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" 
                           style="width: 100%; height: 42px; padding: 0 0.85rem; background: var(--bg-surface-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.9rem; outline: none;">
                </div>

                <div class="flex items-center gap-2" style="margin-bottom: 1.5rem;">
                    <input type="checkbox" id="remember" checked style="accent-color: var(--accent-primary);">
                    <label for="remember" style="font-size: 0.82rem; color: var(--text-secondary);">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    Login
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
                Don't have an account? <a href="signup/" style="color: var(--accent-primary); font-weight: 600;">Create Account</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" style="padding: 1.5rem; margin-top: 0;">
        <div class="footer-bottom" style="border-top: none; padding-top: 0;">
            <p>© 2026 EarnifyX Lab.</p>
            <p><a href="./" style="color: var(--accent-primary);">← Back to Homepage</a></p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/auth-ui.js"></script>
    <script src="js/main.js"></script>

    <script>
        function handleOAuthLogin(provider) {
            // FUTURE SUPABASE AUTHENTICATION: Connect provider with signInWithOAuth().
            showToast(`${provider} authentication will be connected with Supabase.`);
        }

        function handleFormLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            // FUTURE SUPABASE AUTH: Replace this demo session with signInWithPassword().
            AuthUI.setUser({ name: email.split("@")[0], email: email, isPro: false, memberSince: new Date().toISOString() });
            showToast("Welcome back! Signing in...");
            setTimeout(() => {
                window.location.href = "dashboard/";
            }, 800);
        }
    </script>
</body>
</html>
