<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — EarnifyX Lab</title>
    <meta name="description" content="Sign up for EarnifyX Lab to save prompts, bookmark tools, and download creator software.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between;">

    <header class="site-header">
        <div class="header-left">
            <a href="index.html" class="brand-logo">
                <div class="flask-icon">
                    <img src="assets/icons/logo.svg" alt="EarnifyX Lab Logo" width="28" height="28">
                </div>
                <div class="brand-text">
                    <span class="brand-title">Earnify<span>X</span>Lab</span>
                    <span class="brand-tagline">Tools • Prompts • Resources</span>
                </div>
            </a>
        </div>
        <div class="header-right">
            <button class="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
                <span class="theme-toggle-icon">🌙</span>
            </button>
        </div>
    </header>

    <main style="display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; flex: 1;">
        <div style="background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.5rem; max-width: 460px; width: 100%; box-shadow: var(--shadow-md);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.35rem;">Create Your Account</h1>
                <p class="text-secondary" style="font-size: 0.9rem;">Join EarnifyX Lab and explore powerful tools, prompts and resources.</p>
            </div>

            <button class="btn btn-secondary" style="width: 100%; height: 44px; margin-bottom: 1.25rem; font-size: 0.9rem;" onclick="handleOAuthSignup('Google')">
                <span style="font-weight: 700; color: #ea4335;">G</span> Continue with Google
            </button>

            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; color: var(--text-muted); font-size: 0.78rem;">
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                <span>OR EMAIL</span>
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
            </div>

            <form id="signupForm" onsubmit="handleFormSignup(event)">
                <!-- FUTURE SUPABASE AUTHENTICATION
                     const { data, error } = await supabase.auth.signUp({
                         email: emailInput.value,
                         password: passwordInput.value,
                         options: { data: { full_name: nameInput.value } }
                     });
                -->
                <div style="margin-bottom: 1.1rem;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.4rem;" for="name">
                        Full Name
                    </label>
                    <input type="text" id="name" required placeholder="Suraj Kumar" 
                           style="width: 100%; height: 42px; padding: 0 0.85rem; background: var(--bg-surface-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.9rem; outline: none;">
                </div>

                <div style="margin-bottom: 1.1rem;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.4rem;" for="email">
                        Email Address
                    </label>
                    <input type="email" id="email" required placeholder="name@example.com" 
                           style="width: 100%; height: 42px; padding: 0 0.85rem; background: var(--bg-surface-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.9rem; outline: none;">
                </div>

                <div style="margin-bottom: 1.1rem;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.4rem;" for="password">
                        Password
                    </label>
                    <input type="password" id="password" required placeholder="At least 8 characters" minlength="8"
                           style="width: 100%; height: 42px; padding: 0 0.85rem; background: var(--bg-surface-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.9rem; outline: none;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.4rem;" for="confirmPassword">
                        Confirm Password
                    </label>
                    <input type="password" id="confirmPassword" required placeholder="Re-type password" minlength="8"
                           style="width: 100%; height: 42px; padding: 0 0.85rem; background: var(--bg-surface-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.9rem; outline: none;">
                </div>

                <div class="flex items-center gap-2" style="margin-bottom: 1.25rem;">
                    <input type="checkbox" id="terms" required style="accent-color: var(--accent-primary);">
                    <label for="terms" style="font-size: 0.82rem; color: var(--text-secondary);">I agree to the Terms &amp; Privacy Policy</label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    Create Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
                Already have an account? <a href="login.html" style="color: var(--accent-primary); font-weight: 600;">Login</a>
            </div>
        </div>
    </main>

    <footer class="site-footer" style="padding: 1.5rem; margin-top: 0;">
        <div class="footer-bottom" style="border-top: none; padding-top: 0;">
            <p>© 2026 EarnifyX Lab.</p>
            <p><a href="index.html" style="color: var(--accent-primary);">← Back to Homepage</a></p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/auth-ui.js"></script>
    <script src="js/main.js"></script>

    <script>
        function handleOAuthSignup(provider) {
            // FUTURE SUPABASE AUTHENTICATION: Connect provider with signInWithOAuth().
            showToast(`${provider} authentication will be connected with Supabase.`);
        }

        function handleFormSignup(e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (pass !== confirm) {
                showToast("⚠️ Passwords do not match!");
                return;
            }

            // FUTURE SUPABASE AUTH: Replace this demo session with signUp().
            AuthUI.setUser({ name: name, email: email, isPro: false, memberSince: new Date().toISOString() });
            showToast(`🎉 Welcome ${name}! Account created.`);
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 800);
        }
    </script>
</body>
</html>
